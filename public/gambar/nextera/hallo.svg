<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Stylised mockup of a real-time chat app with an AI assistant and video call">
  <defs>
    <linearGradient id="hlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="hlclip"><rect x="0" y="0" width="800" height="450" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#hlclip)">
    <rect width="800" height="450" fill="url(#hlbg)"/>

    <!-- chrome -->
    <rect x="0" y="0" width="800" height="34" fill="#0b0a1f" opacity="0.7"/>
    <circle cx="22" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="17" r="5" fill="#34d399"/>
    <rect x="86" y="10" width="160" height="14" rx="7" fill="#241f4d"/>

    <!-- conversation list -->
    <rect x="0" y="34" width="196" height="416" fill="#161334" opacity="0.9"/>
    <rect x="20" y="58" width="80" height="9" rx="4.5" fill="#4c3fa3"/>
    <g>
      <rect x="14" y="86" width="168" height="52" rx="8" fill="#221c4d"/>
      <circle cx="42" cy="112" r="16" fill="#6366f1" opacity="0.7"/>
      <rect x="68" y="100" width="76" height="8" rx="4" fill="#3b338a"/>
      <rect x="68" y="116" width="52" height="7" rx="3.5" fill="#2e2769"/>
      <circle cx="54" cy="124" r="4.5" fill="#22c55e" stroke="#221c4d" stroke-width="2"/>
    </g>
    <g>
      <rect x="14" y="148" width="168" height="52" rx="8" fill="#1b1740"/>
      <circle cx="42" cy="174" r="16" fill="#8b5cf6" opacity="0.6"/>
      <rect x="68" y="162" width="62" height="8" rx="4" fill="#332c78"/>
      <rect x="68" y="178" width="70" height="7" rx="3.5" fill="#28225e"/>
      <circle cx="166" cy="168" r="8" fill="#6366f1"/>
    </g>
    <g>
      <rect x="14" y="210" width="168" height="52" rx="8" fill="#1b1740"/>
      <circle cx="42" cy="236" r="16" fill="#a78bfa" opacity="0.5"/>
      <rect x="68" y="224" width="70" height="8" rx="4" fill="#332c78"/>
      <rect x="68" y="240" width="46" height="7" rx="3.5" fill="#28225e"/>
    </g>

    <!-- chat header with call buttons -->
    <rect x="196" y="34" width="428" height="52" fill="#12102b"/>
    <circle cx="228" cy="60" r="16" fill="#6366f1" opacity="0.7"/>
    <rect x="254" y="50" width="86" height="9" rx="4.5" fill="#3b338a"/>
    <rect x="254" y="66" width="48" height="7" rx="3.5" fill="#22c55e" opacity="0.5"/>
    <g transform="translate(538 48)">
      <rect width="26" height="24" rx="7" fill="#241f4d"/>
      <path d="M8 8 h7 a2 2 0 0 1 2 2 v4 a2 2 0 0 1-2 2 h-7 a2 2 0 0 1-2-2 v-4 a2 2 0 0 1 2-2 z" fill="#a5b4fc"/>
      <path d="M19 11 l4-3 v8 l-4-3 z" fill="#a5b4fc"/>
    </g>
    <g transform="translate(572 48)">
      <rect width="26" height="24" rx="7" fill="#241f4d"/>
      <path d="M9 9 c0 6 3 9 8 9 l2-3 -4-2 -1 1 c-2-1-3-2-3-4 l1-1 -2-4 -1 0 z" fill="#a5b4fc"/>
    </g>

    <!-- messages -->
    <rect x="196" y="86" width="428" height="290" fill="#100e26"/>
    <g>
      <rect x="220" y="106" width="176" height="38" rx="12" fill="#1e1a45"/>
      <rect x="236" y="121" width="128" height="8" rx="4" fill="#332c78"/>
    </g>
    <g>
      <rect x="404" y="156" width="196" height="38" rx="12" fill="#4f46e5" opacity="0.6"/>
      <rect x="420" y="171" width="150" height="8" rx="4" fill="#c7d2fe" opacity="0.6"/>
    </g>

    <!-- translated message with badge -->
    <g>
      <rect x="220" y="206" width="212" height="52" rx="12" fill="#1e1a45"/>
      <rect x="236" y="220" width="150" height="8" rx="4" fill="#332c78"/>
      <rect x="236" y="238" width="112" height="7" rx="3.5" fill="#2a2465"/>
      <rect x="336" y="196" width="96" height="18" rx="9" fill="#0ea5e9" opacity="0.35"/>
      <text x="384" y="209" font-family="Inter, Arial, sans-serif" font-size="10" fill="#bae6fd" text-anchor="middle">translated</text>
    </g>

    <!-- AI assistant message -->
    <g>
      <rect x="220" y="278" width="286" height="62" rx="12" fill="#172554" opacity="0.85"/>
      <circle cx="246" cy="298" r="12" fill="#38bdf8" opacity="0.75"/>
      <rect x="240" y="294" width="12" height="8" rx="2" fill="#0c4a6e"/>
      <rect x="266" y="294" width="60" height="8" rx="4" fill="#0ea5e9" opacity="0.55"/>
      <rect x="240" y="316" width="240" height="7" rx="3.5" fill="#1e40af" opacity="0.7"/>
      <rect x="240" y="330" width="176" height="7" rx="3.5" fill="#1e40af" opacity="0.5"/>
    </g>

    <!-- composer -->
    <rect x="196" y="376" width="428" height="74" fill="#12102b"/>
    <rect x="220" y="396" width="330" height="34" rx="17" fill="#1e1a45"/>
    <rect x="240" y="409" width="120" height="8" rx="4" fill="#2e2769"/>
    <circle cx="580" cy="413" r="17" fill="#6366f1" opacity="0.85"/>
    <path d="M573 413 l14-6 -5 6 5 6 z" fill="#e0e7ff"/>

    <!-- video call side panel -->
    <rect x="624" y="34" width="176" height="416" fill="#0d0b22"/>
    <rect x="644" y="58" width="136" height="96" rx="8" fill="#1e1a45"/>
    <circle cx="712" cy="100" r="22" fill="#6366f1" opacity="0.55"/>
    <rect x="644" y="166" width="136" height="96" rx="8" fill="#171334"/>
    <circle cx="712" cy="208" r="22" fill="#8b5cf6" opacity="0.4"/>
    <g transform="translate(668 282)">
      <circle cx="14" cy="14" r="14" fill="#241f4d"/>
      <circle cx="52" cy="14" r="14" fill="#241f4d"/>
      <circle cx="90" cy="14" r="14" fill="#ef4444" opacity="0.75"/>
    </g>
    <rect x="644" y="330" width="136" height="8" rx="4" fill="#241f4d"/>
    <rect x="644" y="348" width="100" height="8" rx="4" fill="#1c1840"/>
  </g>
</svg>
