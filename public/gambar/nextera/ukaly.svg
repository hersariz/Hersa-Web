<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Stylised mockup of a travel booking platform with map and payment step">
  <defs>
    <linearGradient id="ukbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <clipPath id="ukclip"><rect x="0" y="0" width="800" height="450" rx="10"/></clipPath>
    <clipPath id="ukmap"><rect x="24" y="98" width="420" height="256" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#ukclip)">
    <rect width="800" height="450" fill="url(#ukbg)"/>

    <!-- top bar -->
    <rect x="0" y="0" width="800" height="34" fill="#022c22" opacity="0.7"/>
    <circle cx="22" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="17" r="5" fill="#34d399"/>
    <rect x="86" y="10" width="180" height="14" rx="7" fill="#0f3b3a"/>

    <!-- search bar -->
    <rect x="24" y="52" width="420" height="34" rx="17" fill="#0b3a3f"/>
    <circle cx="48" cy="69" r="7" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    <line x1="53" y1="74" x2="59" y2="80" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="70" y="64" width="150" height="9" rx="4.5" fill="#134e4a"/>
    <rect x="352" y="60" width="76" height="18" rx="9" fill="#14b8a6" opacity="0.8"/>

    <!-- map panel -->
    <rect x="24" y="98" width="420" height="256" rx="8" fill="#07343a"/>
    <g clip-path="url(#ukmap)" opacity="0.95">
      <!-- water + land shapes -->
      <path d="M24 98 H444 V354 H24 Z" fill="#06303a"/>
      <path d="M60 150 Q150 120 240 148 T430 160 L440 260 Q330 300 220 276 T50 290 Z" fill="#0f766e" opacity="0.45"/>
      <path d="M90 210 Q170 190 250 212 T400 220 L404 268 Q300 296 200 274 T86 268 Z" fill="#115e59" opacity="0.6"/>
      <!-- roads -->
      <path d="M24 232 H444" stroke="#0d9488" stroke-width="2" opacity="0.35"/>
      <path d="M190 98 V354" stroke="#0d9488" stroke-width="2" opacity="0.35"/>
      <path d="M320 98 V354" stroke="#0d9488" stroke-width="1.5" opacity="0.25"/>
      <!-- pins -->
      <g>
        <path d="M140 196 c0-11 9-20 20-20 s20 9 20 20 c0 15-20 34-20 34 s-20-19-20-34 z" fill="#f97316"/>
        <circle cx="160" cy="196" r="7" fill="#fff7ed"/>
      </g>
      <g>
        <path d="M268 168 c0-9 7-16 16-16 s16 7 16 16 c0 12-16 27-16 27 s-16-15-16-27 z" fill="#14b8a6"/>
        <circle cx="284" cy="168" r="5.5" fill="#ecfeff"/>
      </g>
      <g>
        <path d="M352 246 c0-9 7-16 16-16 s16 7 16 16 c0 12-16 27-16 27 s-16-15-16-27 z" fill="#38bdf8"/>
        <circle cx="368" cy="246" r="5.5" fill="#f0f9ff"/>
      </g>
      <!-- QR marker -->
      <g transform="translate(206 272)">
        <rect width="46" height="46" rx="7" fill="#022c22" stroke="#5eead4" stroke-width="2"/>
        <rect x="8" y="8" width="12" height="12" rx="2" fill="#5eead4"/>
        <rect x="26" y="8" width="12" height="12" rx="2" fill="#5eead4"/>
        <rect x="8" y="26" width="12" height="12" rx="2" fill="#5eead4"/>
        <rect x="28" y="28" width="6" height="6" rx="1" fill="#5eead4"/>
      </g>
    </g>

    <!-- booking / payment panel -->
    <rect x="464" y="52" width="312" height="302" rx="8" fill="#08333a"/>
    <rect x="484" y="72" width="120" height="10" rx="5" fill="#134e4a"/>

    <!-- experience card -->
    <rect x="484" y="98" width="272" height="72" rx="8" fill="#0b3f45"/>
    <rect x="496" y="110" width="48" height="48" rx="6" fill="#0d9488" opacity="0.55"/>
    <rect x="556" y="114" width="120" height="9" rx="4.5" fill="#1d5e63"/>
    <rect x="556" y="132" width="86" height="8" rx="4" fill="#155e63" opacity="0.7"/>
    <rect x="556" y="148" width="60" height="8" rx="4" fill="#f59e0b" opacity="0.55"/>

    <!-- steps -->
    <g>
      <circle cx="496" cy="196" r="9" fill="#14b8a6"/>
      <rect x="514" y="192" width="70" height="8" rx="4" fill="#155e63"/>
      <circle cx="496" cy="224" r="9" fill="#14b8a6"/>
      <rect x="514" y="220" width="94" height="8" rx="4" fill="#155e63"/>
      <circle cx="496" cy="252" r="9" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <rect x="514" y="248" width="58" height="8" rx="4" fill="#0f4a50"/>
    </g>

    <!-- card / payment field -->
    <rect x="484" y="278" width="272" height="40" rx="8" fill="#0b3f45"/>
    <rect x="498" y="292" width="26" height="14" rx="3" fill="#6366f1" opacity="0.85"/>
    <rect x="534" y="294" width="120" height="9" rx="4.5" fill="#155e63"/>
    <rect x="700" y="292" width="42" height="14" rx="7" fill="#22c55e" opacity="0.5"/>

    <!-- pay button -->
    <rect x="484" y="328" width="272" height="12" rx="6" fill="#14b8a6" opacity="0.85"/>

    <!-- caption -->
    <text x="24" y="392" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0f766e">Illustrative mockup — client UI and data not shown</text>
  </g>
</svg>
