<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Stylised mockup of a government data visualization dashboard">
  <defs>
    <linearGradient id="dvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dvbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="dvclip"><rect x="0" y="0" width="800" height="450" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#dvclip)">
    <rect width="800" height="450" fill="url(#dvbg)"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="800" height="34" fill="#020617" opacity="0.6"/>
    <circle cx="22" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="17" r="5" fill="#34d399"/>
    <rect x="86" y="10" width="200" height="14" rx="7" fill="#1e293b"/>

    <!-- sidebar -->
    <rect x="0" y="34" width="150" height="416" fill="#0b1220" opacity="0.75"/>
    <rect x="20" y="60" width="90" height="9" rx="4.5" fill="#334155"/>
    <rect x="20" y="94" width="110" height="9" rx="4.5" fill="#3b82f6" opacity="0.85"/>
    <rect x="20" y="120" width="80" height="9" rx="4.5" fill="#334155"/>
    <rect x="20" y="146" width="100" height="9" rx="4.5" fill="#334155"/>
    <rect x="20" y="172" width="70" height="9" rx="4.5" fill="#334155"/>
    <rect x="20" y="206" width="95" height="9" rx="4.5" fill="#334155"/>

    <!-- language pills -->
    <rect x="640" y="52" width="42" height="20" rx="10" fill="#1e293b"/>
    <text x="661" y="66" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EN</text>
    <rect x="690" y="52" width="42" height="20" rx="10" fill="#3b82f6" opacity="0.3"/>
    <text x="711" y="66" font-family="Inter, Arial, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">FR</text>

    <!-- KPI row -->
    <g>
      <rect x="176" y="52" width="126" height="62" rx="8" fill="#111c33"/>
      <rect x="190" y="66" width="46" height="7" rx="3.5" fill="#334155"/>
      <rect x="190" y="82" width="70" height="16" rx="4" fill="#60a5fa" opacity="0.75"/>
      <rect x="316" y="52" width="126" height="62" rx="8" fill="#111c33"/>
      <rect x="330" y="66" width="54" height="7" rx="3.5" fill="#334155"/>
      <rect x="330" y="82" width="58" height="16" rx="4" fill="#818cf8" opacity="0.75"/>
      <rect x="456" y="52" width="126" height="62" rx="8" fill="#111c33"/>
      <rect x="470" y="66" width="40" height="7" rx="3.5" fill="#334155"/>
      <rect x="470" y="82" width="66" height="16" rx="4" fill="#38bdf8" opacity="0.7"/>
    </g>

    <!-- bar chart panel -->
    <rect x="176" y="132" width="330" height="180" rx="8" fill="#111c33"/>
    <rect x="192" y="148" width="88" height="8" rx="4" fill="#334155"/>
    <g>
      <rect x="196" y="236" width="30" height="56" rx="4" fill="url(#dvbar)"/>
      <rect x="238" y="208" width="30" height="84" rx="4" fill="url(#dvbar)"/>
      <rect x="280" y="252" width="30" height="40" rx="4" fill="url(#dvbar)"/>
      <rect x="322" y="188" width="30" height="104" rx="4" fill="url(#dvbar)"/>
      <rect x="364" y="222" width="30" height="70" rx="4" fill="url(#dvbar)"/>
      <rect x="406" y="200" width="30" height="92" rx="4" fill="url(#dvbar)"/>
      <rect x="448" y="244" width="30" height="48" rx="4" fill="url(#dvbar)"/>
      <polyline points="211,222 253,196 295,238 337,176 379,208 421,186 463,230"
                fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="337" cy="176" r="4" fill="#c7d2fe"/>
    </g>
    <line x1="192" y1="296" x2="490" y2="296" stroke="#1e293b" stroke-width="1.5"/>

    <!-- choropleth map panel -->
    <rect x="520" y="132" width="262" height="180" rx="8" fill="#111c33"/>
    <rect x="536" y="148" width="70" height="8" rx="4" fill="#334155"/>
    <g opacity="0.9">
      <path d="M566 190 L616 176 L648 196 L634 232 L588 240 L558 218 Z" fill="#1d4ed8" opacity="0.75"/>
      <path d="M648 196 L700 182 L730 206 L714 240 L664 244 L634 232 Z" fill="#3b82f6" opacity="0.6"/>
      <path d="M588 240 L634 232 L664 244 L652 282 L602 288 L578 268 Z" fill="#60a5fa" opacity="0.5"/>
      <path d="M664 244 L714 240 L742 262 L724 290 L676 292 L652 282 Z" fill="#93c5fd" opacity="0.42"/>
      <circle cx="636" cy="214" r="4" fill="#e0e7ff"/>
      <circle cx="694" cy="228" r="3" fill="#e0e7ff" opacity="0.8"/>
    </g>
    <!-- legend -->
    <g>
      <rect x="536" y="286" width="18" height="7" rx="2" fill="#1d4ed8"/>
      <rect x="558" y="286" width="18" height="7" rx="2" fill="#3b82f6"/>
      <rect x="580" y="286" width="18" height="7" rx="2" fill="#60a5fa"/>
      <rect x="602" y="286" width="18" height="7" rx="2" fill="#93c5fd"/>
    </g>

    <!-- data table strip -->
    <rect x="176" y="330" width="606" height="76" rx="8" fill="#111c33"/>
    <line x1="176" y1="356" x2="782" y2="356" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="192" y="342" width="60" height="7" rx="3.5" fill="#475569"/>
    <rect x="300" y="342" width="48" height="7" rx="3.5" fill="#475569"/>
    <rect x="420" y="342" width="56" height="7" rx="3.5" fill="#475569"/>
    <rect x="560" y="342" width="44" height="7" rx="3.5" fill="#475569"/>
    <rect x="192" y="368" width="90" height="7" rx="3.5" fill="#293548"/>
    <rect x="300" y="368" width="70" height="7" rx="3.5" fill="#293548"/>
    <rect x="420" y="368" width="80" height="7" rx="3.5" fill="#293548"/>
    <rect x="560" y="368" width="60" height="7" rx="3.5" fill="#293548"/>
    <rect x="192" y="386" width="76" height="7" rx="3.5" fill="#232f42"/>
    <rect x="300" y="386" width="86" height="7" rx="3.5" fill="#232f42"/>
    <rect x="420" y="386" width="64" height="7" rx="3.5" fill="#232f42"/>
    <rect x="560" y="386" width="72" height="7" rx="3.5" fill="#232f42"/>

    <!-- caption -->
    <text x="176" y="436" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b">
      Illustrative mockup — client UI and data not shown
    </text>
  </g>
</svg>
